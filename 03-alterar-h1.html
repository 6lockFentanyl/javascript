<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modificar H1 com JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
  </style>
</head>
<body>
  <h1 id="titulo">Título original</h1>
  <script>
    const titulo = document.querySelector("#titulo");
    const tamanhoAleatorio = Math.floor(Math.random() * 71) + 30; // 30 a 100 px
    const cores = ["crimson", "royalblue", "seagreen", "darkorange", "purple"];
    const corAleatoria = cores[Math.floor(Math.random() * cores.length)];

    titulo.textContent = "Meu título foi alterado pelo JavaScript!";
    titulo.style.color = corAleatoria;
    titulo.style.fontSize = `${tamanhoAleatorio}px`;
  </script>
</body>
</html>
