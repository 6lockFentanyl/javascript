<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sabor de sorvete — modo escuro</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background: #ffffff;
      color: #202124;
      transition: background .2s, color .2s;
    }
    input, button { font: inherit; padding: .5rem; }
    body.escuro { background: #171717; color: #f5f5f5; }
    body.escuro input, body.escuro button {
      background: #292929; color: #ffffff; border: 1px solid #aaaaaa;
    }
  </style>
</head>
<body>
  <h1>Qual é seu sabor de sorvete?</h1>
  <button id="modo" type="button" aria-pressed="false">Ativar modo escuro</button>
  <p>
    <label for="sabor">Digite um sabor:</label>
    <input id="sabor" type="text" placeholder="Ex.: chocolate">
  </p>
  <p id="resposta" aria-live="polite">Digite um sabor com mais de 3 letras.</p>
  <script>
    const campo = document.querySelector("#sabor");
    const resposta = document.querySelector("#resposta");
    const botaoModo = document.querySelector("#modo");

    campo.addEventListener("input", () => {
      const texto = campo.value.trim().toLowerCase();
      if (texto.length <= 3) {
        resposta.textContent = "Digite um sabor com mais de 3 letras.";
      } else if (texto.includes("chocolate")) {
        resposta.textContent = "Eu amo sorvete de chocolate!";
      } else if (texto.includes("flocos")) {
        resposta.textContent = "Ahh, mas chocolate é o meu favorito...";
      } else {
        resposta.textContent = "Ahh, eu esperava um sabor de sorvete...";
      }
    });

    botaoModo.addEventListener("click", () => {
      const ativado = document.body.classList.toggle("escuro");
      botaoModo.textContent = ativado ? "Ativar modo claro" : "Ativar modo escuro";
      botaoModo.setAttribute("aria-pressed", String(ativado));
    });
  </script>
</body>
</html>
